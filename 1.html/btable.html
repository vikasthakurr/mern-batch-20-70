  <body>
    <!-- 
      BOOTSTRAP TABLE CLASSES:

      1. Base Class:
         - class="table": Applies the base styling (padding, borders).

      2. Variants:
         - class="table-dark": Dark background for the table.
         - class="table-light": Light background for the table.

      3. Hover Effect:
         - class="table-hover": Adds a hover effect to table rows.

      4. Responsive Design:
         - class="table-responsive": Makes the table scrollable horizontally on small screens.

      5. Border Styling:
         - class="table-bordered": Adds borders to all cells.
         - class="table-borderless": Removes all borders.

      6. Table Head Styling:
         - class="thead-dark" or "thead-light": Styles the header section.

      7. Striped Rows:
         - class="table-striped": Adds alternating background colors to rows (zebra striping).

      8. Contextual Classes (Colors):
         - table-primary, table-success, table-danger, table-warning, table-info, table-secondary, table-light, table-dark
         - Used on <tr> (rows) or <td> (cells) to color them based on meaning.
    -->
    <table
      class="table table-bordered table-hover table-responsive text-center"
    >
