<!doctype html> <!-- Informs the browser that this is an HTML5 document -->
<html lang="en"> <!-- Root element; 'lang="en"' tells search engines/screen readers the language is English -->
  <head> <!-- Contains meta-information (data about data) not visible to the user -->
    <meta charset="UTF-8" /> <!-- Sets character encoding to UTF-8 (supports almost all characters/symbols) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the website responsive; scales to device width -->
    <title>Document</title> <!-- The title displayed in the browser tab -->
  </head>
  <body>
    <!-- 
      HISTORY OF HTML:
      - 1989: Tim Berners-Lee invents the World Wide Web.
      - 1991: HTML 1.0 - The first public version with 18 basic tags.
      - 1995: HTML 2.0 - First official standard.
      - 1999: HTML 4.01 - Focused on separating structure (HTML) from presentation (CSS).
      - 2014: HTML5 - Modern standard with native multimedia support (audio/video) and semantic tags.

      MARKUP VS MARKDOWN:
      1. Markup Language (e.g., HTML, XML):
         - Uses explicit tags (like <div>, <b>) to define structure.
         - Designed for both machines and humans but can be verbose.
         - Provides fine-grained control over layout and behavior.

      2. Markdown Language (e.g., CommonMark):
         - A lightweight syntax designed primarily for human readability.
         - Uses simple symbols (like ** for bold, # for headers).
         - Easily converted to HTML; ideal for documentation and READMEs.
    -->
  </body>
</html>
