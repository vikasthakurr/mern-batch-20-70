    <!-- 
      HTML TABLES NOTES:

      1. TABLE STRUCTURE:
         - <table>: The main container for the table.
         - <tr> (Table Row): Defines a row within the table.
         - <th> (Table Header): Defines header cells (usually bold and centered).
         - <td> (Table Data): Defines standard data cells.

      2. SEMANTIC SECTIONS:
         - <thead>: Groups the header content (usually the first row).
         - <tbody>: Groups the body content (the main data).
         - <tfoot>: Groups the footer content (summary or totals).

      3. KEY ATTRIBUTES:
         - border: Adds a border around the table and cells (less used in modern CSS).
         - cellpadding: Adds space INSIDE the cells (between border and content).
         - cellspacing: Adds space OUTSIDE the cells (between cells).
         - colspan: Allows a cell to span multiple columns.
         - rowspan: Allows a cell to span multiple rows.  
    -->
    <table cellpadding="10px" cellspacing="5px" text-align="center">
