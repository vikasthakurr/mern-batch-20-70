    <!-- 
      HTML TAGS & TYPOGRAPHY NOTES:

      1. HTML TAGS BASICS:
         - Container Tags: Have both opening and closing tags. 
           Example: <p>Content</p>, <div></div>
         - Empty/Self-Closing Tags: Do not require a closing tag.
           Example: <br />, <hr />, <img />, <input />

      2. TYPOGRAPHY ELEMENTS (Text Hierarchy & Formatting):
         - Headings (<h1> to <h6>):
           <h1>: Main heading (most important, use once per page for SEO).
           <h6>: Least important heading.
         - Paragraph (<p>): Defines a block of text. Browsers automatically add margins before/after.
         - Span (<span>): An inline container used to mark up a part of a text or a part of a document.
         - Preformatted Text (<pre>): Displays text exactly as written in the HTML file, preserving spaces and line breaks.
         - Break (<br>): Inserts a single line break.
         - Horizontal Rule (<hr>): Defines a thematic break (a horizontal line).

      3. TEXT FORMATTING (Semantic vs. Visual):
         - <b> vs <strong>: <b> is just bold; <strong> indicates importance.
         - <i> vs <em>: <i> is just italic; <em> indicates emphasis.
         - <u>: Underlines text.
         - <mark>: Highlights text.
         - <small>: Renders smaller text.

      4. Semenatic tags -> the tags which gives meaning to the content:
        <h1>...</h1>
        <header></header>
        <footer></footer>
        <section></section>
        <article></article>
        <nav></nav>

      5. Non-Semenatic tags -> the tags which does not give meaning to the content:
        <div></div>
        <span></span>
        

      6- inline tags are those tags which take only the space which is required by the content.
        (the tags are written in the same line) (example ->) <span>thakur</span>
        <br />
        <hr />

      7- block tags are those tags which take the full width of the page.
        (the tags are written in the new line) (example ->) <p>thakur</p>

    -->
    <h1>Hello, World!</h1>
