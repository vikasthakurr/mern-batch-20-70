    <!-- 
      HTML LISTS NOTES:

      1. UNORDERED LIST (<ul>):
         - Used for items where the order does NOT matter.
         - Displays with bullets by default.
         - Contains List Items (<li>).

      2. ORDERED LIST (<ol>):
         - Used for items where the order DOES matter.
         - Displays with numbers by default.
         - Attributes:
           - type: Changes the numbering style (e.g., "1", "A", "a", "I", "i").
           - start: Defines the starting number of the list.
           - reversed: Reverses the numbering order.

      3. LIST ITEM (<li>):
         - Used inside both <ul> and <ol> to define each item in the list.

      4. DESCRIPTION LIST (<dl>):
         - Used for a list of terms and their corresponding descriptions (like a glossary).
         - <dt> (Description Term): The name or title of the item.
         - <dd> (Description Data): The explanation or description of the term.

      5. NESTED LISTS:
         - A list can be placed inside another list item to create a sub-list.
    -->
