<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 
        CSS GRID LAYOUT
        - CSS Grid is a 2-dimensional layout system for the web.
        - It allows you to align content into rows and columns.
        
        1. CONTAINER PROPERTIES (Parent):
        - display: grid; (Defines the element as a grid container)
        - grid-template-columns: repeat(3, 1fr); (Defines the number and size of columns)
        - grid-template-rows: 100px 200px; (Defines the number and size of rows)
        - gap / row-gap / column-gap: 10px; (Spacing between grid items)
        - grid-template-areas: "header header" "sidebar content"; (Defines a grid template by referencing names of grid areas)
        - justify-items: start | end | center | stretch; (Aligns items along the row/inline axis)
        - align-items: start | end | center | stretch; (Aligns items along the column/block axis)
        - justify-content: space-around | space-between | center; (Aligns the entire grid within the container)
        
        2. ITEM PROPERTIES (Children):
        - grid-column: 1 / 3; (Shorthand for grid-column-start and grid-column-end)
        - grid-row: 2 / 4; (Shorthand for grid-row-start and grid-row-end)
        - grid-area: name; (Assigns an item a name to be used with grid-template-areas)
      */

      .container {
        width: 100vw;
        height: 100vh;
        background-color: beige;
        display: grid;
        /* grid-template-columns: repeat(3, 1fr); */
        /* grid-template-areas defines the layout using named areas */
        grid-template-areas: "header header header" "sidebar content-1 content-1" "sidebar content-2 content-3" "footer footer footer";
        /* grid-template-rows: ; */
        /* row-gap: 10px;
        column-gap: 10px; */
        gap: 10px;
        /* justify-content: center;
        align-content: center; */
      }
      .child {
        background-color: aqua;
        /* width: 100px;
        height: 100px; */
        /* margin: 5px; */
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .child-1 {
        /* Assigns this element to the 'header' area defined in the container */
        grid-area: header;
      }
      .child-2 {
        /* Assigns this element to the 'sidebar' area */
        grid-area: sidebar;
      }
      .child-3 {
        grid-area: content-1;
      }
      .child-4 {
        grid-area: content-2;
      }
      .child-5 {
        grid-area: content-3;
      }
      .child-6 {
        grid-area: footer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="child child-1">navbar</div>
      <div class="child child-2">sidebr</div>
      <div class="child child-3">content-1</div>
      <div class="child child-4">content-2</div>
      <div class="child child-5">content-3</div>
      <div class="child child-6">footer</div>
    </div>
  </body>
</html>
