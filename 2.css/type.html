<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
    <style>
      h1 {
        color: green;
      }
    </style>
    <script defer></script>
  </head>
  <body>
    <h1>Vikas</h1>
    <!--
      Notes on CSS:
      - CSS stands for Cascading Style Sheets.
      - It is used to control the appearance and layout of HTML elements on a web page.
      - There are three main types of CSS:
        1. Inline CSS: styles are written directly in the HTML element using the style attribute.
        2. Internal CSS: styles are written inside a <style> block in the HTML document head.
        3. External CSS: styles are written in a separate .css file and linked to the HTML page with <link>.
      - Cascading means that when multiple CSS rules apply to the same element, the browser chooses which styles to use based on rule order, specificity, and source.
    -->
  </body>
  <script></script>
</html>
