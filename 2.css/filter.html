<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* 
      CSS FILTER PROPERTY:
      Used to apply graphical effects like blur or color shift to an element.
      Common Filter Functions:
      - blur(px): Applies a Gaussian blur.
      - brightness(%): Adjusts brightness (0% is black, 100% is normal).
      - contrast(%): Adjusts contrast.
      - grayscale(%): Converts to grayscale.
      - sepia(%): Converts to sepia (old-timey look).
      - hue-rotate(deg): Applies a hue rotation.
      - invert(%): Inverts samples in the input image.
      - opacity(%): Sets transparency level.
      - saturate(%): Super-saturates or de-saturates the image.
      - drop-shadow(h-shadow v-shadow blur spread color): Adds a shadow effect.
      */

      img {
        /* filter: blur(5px); */
        /* filter: brightness(150%); */
        filter: sepia(100%);
        transition: filter 0.3s ease;
      }

      img:hover {
        filter: none; /* Removes filter on hover */
      }

      /* 
      CSS BACKGROUND PROPERTIES:
      Used to define the background effects for elements.
      - background-color: Sets the background color.
      - background-image: Sets one or more background images (url("...")).
      - background-repeat: Sets if/how a background image will be repeated (repeat, no-repeat, repeat-x).
      - background-attachment: Sets whether a background image is fixed or scrolls with the page.
      - background-position: Sets the starting position of a background image.
      - background-size: Sets the size of the background image (cover, contain, or specific px/%).
      - background (shorthand): color image repeat attachment position / size
      */

      .bg-demo {
        width: 100%;
        height: 300px;
        margin-top: 20px;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);

        /* Background Shorthand Example */
        background: #333
          url("https://images.pexels.com/photos/1631677/pexels-photo-1631677.jpeg")
          no-repeat center / cover;
      }
    </style>
  </head>
  <body>
    <h1>CSS Filter & Background Notes</h1>

    <h3>Filter Example (Sepia)</h3>
    <img
      width="400px"
      src="https://images.pexels.com/photos/37439167/pexels-photo-37439167.jpeg"
      alt="Filter Demo"
    />

    <h3>Background Example</h3>
    <div class="bg-demo">Background with Cover</div>
  </body>
</html>
